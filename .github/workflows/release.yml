name: Release

on:
  push:
    # Only publish major releases, for example v2.0.0 or v3.0.0.
    tags:
      - 'v*.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create major GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate major release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.0\.0$ ]]; then
            echo "Expected a major release tag in the form v<major>.0.0; got $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
